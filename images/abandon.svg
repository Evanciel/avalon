<svg viewBox="0 0 1200 250" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, ui-monospace, monospace" role="img" aria-label="A gate that exhausts retries leaves evidence in abandoned[], and completed is forced false while that list is non-empty">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#93A0AE"/>
    </marker>
  </defs>

  <rect width="1200" height="250" rx="14" fill="#0D1219"/>
  <rect x="0.5" y="0.5" width="1199" height="249" rx="14" fill="none" stroke="#26313B"/>

  <!-- gate fails -->
  <rect x="60" y="78" width="212" height="64" rx="8" fill="none" stroke="#FF7A45" stroke-width="1.8"/>
  <text x="166" y="106" font-size="16" fill="#FF7A45" text-anchor="middle">gate fails &#215; retries</text>
  <text x="166" y="128" font-size="13.5" fill="#93A0AE" text-anchor="middle">on_exhaust: partial</text>

  <path d="M272 110 H 330" stroke="#93A0AE" stroke-width="1.6" marker-end="url(#b)"/>

  <!-- evidence recorded -->
  <rect x="336" y="66" width="330" height="88" rx="8" fill="#1B242D" stroke="#93A0AE" stroke-width="1.6"/>
  <text x="501" y="94" font-size="15" fill="#E3E9F0" text-anchor="middle">abandoned[] gets the evidence</text>
  <text x="501" y="120" font-size="13" fill="#93A0AE" text-anchor="middle">{ gate, measured, threshold, attempts }</text>
  <text x="501" y="140" font-size="13" fill="#93A0AE" text-anchor="middle">the run keeps going</text>

  <path d="M666 110 H 724" stroke="#93A0AE" stroke-width="1.6" marker-end="url(#b)"/>

  <!-- verdict -->
  <rect x="730" y="66" width="410" height="88" rx="8" fill="none" stroke="#FF7A45" stroke-width="2"/>
  <text x="935" y="100" font-size="16.5" font-weight="700" fill="#E3E9F0" text-anchor="middle">completed = (abandoned.length === 0)</text>
  <text x="935" y="130" font-size="14" fill="#FF7A45" text-anchor="middle">skipped a gate &#8594; can never report success</text>

  <text x="600" y="215" font-size="14" fill="#6B7885" text-anchor="middle">giving up is terminal, visible, and never counted as done</text>
</svg>
